<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081230" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <!-- Satoshi by Indian Type Foundry, served by Fontshare (ITF Free Font License, free for commercial use). -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <!-- Loaded without blocking the first paint; text shows in the fallback font until Satoshi arrives. -->
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" />
    </noscript>
    <!-- The home hero's still frame, fetched alongside the app code instead of after it. -->
    <link
      rel="preload"
      as="image"
      href="/media/posters/hero-desktop-1280.jpg"
      imagesrcset="/media/posters/hero-desktop-640.jpg 640w, /media/posters/hero-desktop-1280.jpg 1280w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <!-- Page colour before any stylesheet arrives, so first paint is never a white flash. -->
    <style>
      html,
      body {
        background: #081230;
      }
    </style>
    <!-- Default metadata; each route refines these at runtime via useSeo(). -->
    <title>Mechanical Product Design &amp; 3D CAD Engineering</title>
    <meta
      name="description"
      content="Mechanical product design and 3D CAD engineering that takes ideas from concept to manufacturing-ready products: CAD modeling, engineering drawings, DFM and product development."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mechanical Product Design &amp; 3D CAD Engineering" />
    <meta
      property="og:description"
      content="From concept to manufacturing-ready product. Precision-driven mechanical product design and 3D CAD engineering."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:system-ui;color:#f3f6fb;background:#081230">
        This site uses JavaScript for its interactive engineering visualizations. Please enable
        JavaScript to view the full experience.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
